name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke install wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          adapterguard --version
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create minimal adapter fixture
        shell: bash
        run: |
          mkdir -p .ci-adapter
          cat > .ci-adapter/adapter_config.json <<'JSON'
          {
            "base_model_name_or_path": "acme/base",
            "peft_type": "LORA",
            "r": 8,
            "lora_alpha": 16,
            "target_modules": ["q_proj", "v_proj"]
          }
          JSON
          printf 'fake' > .ci-adapter/adapter_model.safetensors

      - name: Run AdapterGuard Action
        id: guard
        uses: ./
        with:
          adapter: .ci-adapter
          install-hf: "false"
          upload-evidence: "false"

      - name: Assert Action outputs
        shell: bash
        env:
          VERDICT: ${{ steps.guard.outputs.verdict }}
          SAFE_TO_SHIP: ${{ steps.guard.outputs.safe-to-ship }}
          REPORT_JSON: ${{ steps.guard.outputs.report-json }}
          REPORT_MARKDOWN: ${{ steps.guard.outputs.report-markdown }}
        run: |
          test "$VERDICT" = "SAFE TO SHIP"
          test "$SAFE_TO_SHIP" = "true"
          test -f "$REPORT_JSON"
          test -f "$REPORT_MARKDOWN"
