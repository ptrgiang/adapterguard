name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, for example v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve release tag
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$MANUAL_TAG"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate tag matches package version
        run: >-
          python src/adapterguard/release_validation.py tag
          --tag "${{ steps.ref.outputs.tag }}"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -q

      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install "torch>=2.2"
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install Hugging Face dependencies
        run: python -m pip install -e ".[hf]"

      - name: Run corrupted-artifact semantic proof
        run: python examples/killer_demo.py

      - name: Run quantization-drift semantic proof
        run: python examples/quantization_demo.py

      - name: Run tokenizer-drift semantic proof
        run: python examples/tokenizer_drift_demo.py

      - name: Run multi-turn semantic proof
        run: python examples/multiturn_demo.py

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel version
        run: >-
          python src/adapterguard/release_validation.py wheel
          --tag "${{ steps.ref.outputs.tag }}"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ steps.ref.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/adapterguard/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve release tag
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$MANUAL_TAG"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ steps.ref.outputs.tag }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
